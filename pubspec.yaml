name: flutter_music_app
description: A modern Flutter Music Player with Deezer/iTunes API, Downloads, and PiP.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0
  http: ^1.2.2
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^18.0.1
  file_picker: ^13.4.1
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
