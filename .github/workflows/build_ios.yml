name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ master, main, feature/deezer-api ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Application (No Code Sign)
        run: flutter build ios --release --no-codesign

      - name: Create .IPA Package
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r QMusic.ipa Payload
          echo "IPA package created successfully."

      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QMusic-iOS
          path: build/ios/iphoneos/QMusic.ipa
          retention-days: 7
